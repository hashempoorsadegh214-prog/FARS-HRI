
name: Check Fars Slope

on:
  workflow_dispatch:

jobs:
  check-slope:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install rasterio numpy

      - name: Analyze slope
        run: |
          python - <<'PY'
          import os
          import numpy as np
          import rasterio

          input_file = "data/topography/fars_slope.tif"

          if not os.path.exists(input_file):
              raise FileNotFoundError(
                  f"File not found: {input_file}"
              )

          with rasterio.open(input_file) as src:

              slope = src.read(1)
              nodata = src.nodata

              print("===================================")
              print("FARS SLOPE ANALYSIS")
              print("===================================")

              print("File:", input_file)
              print("CRS:", src.crs)
              print("Width:", src.width)
              print("Height:", src.height)
              print("Resolution:", src.res)
              print("Data type:", src.dtypes[0])
              print("NoData:", nodata)

              # ایجاد ماسک پیکسل‌های معتبر
              valid = np.isfinite(slope)

              if nodata is not None:
                  valid &= ~np.isclose(slope, nodata)

              values = slope[valid]

              if values.size == 0:
                  raise RuntimeError(
                      "No valid slope pixels found."
                  )

              print("")
              print("----- BASIC STATISTICS -----")
              print("Valid pixels:", values.size)
              print("Minimum:", float(np.min(values)))
              print("Maximum:", float(np.max(values)))
              print("Mean:", float(np.mean(values)))
              print("Median:", float(np.median(values)))

              print("")
              print("----- PERCENTILES -----")
              print("P01:", float(np.percentile(values, 1)))
              print("P05:", float(np.percentile(values, 5)))
              print("P10:", float(np.percentile(values, 10)))
              print("P25:", float(np.percentile(values, 25)))
              print("P50:", float(np.percentile(values, 50)))
              print("P75:", float(np.percentile(values, 75)))
              print("P90:", float(np.percentile(values, 90)))
              print("P95:", float(np.percentile(values, 95)))
              print("P99:", float(np.percentile(values, 99)))

              print("")
              print("----- SLOPE CLASSES -----")

              classes = [
                  ("0-5", (values >= 0) & (values < 5)),
                  ("5-10", (values >= 5) & (values < 10)),
                  ("10-20", (values >= 10) & (values < 20)),
                  ("20-30", (values >= 20) & (values < 30)),
                  (">=30", values >= 30),
              ]

              total = values.size

              for name, mask in classes:
                  count = int(np.sum(mask))
                  percent = (count / total) * 100

                  print(
                      f"{name} degrees: "
                      f"{count} pixels "
                      f"({percent:.2f}%)"
                  )

              print("")
              print("===================================")
              print("SLOPE ANALYSIS COMPLETED")
              print("===================================")
          PY
