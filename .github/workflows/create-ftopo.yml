
name: Create F_Topo

on:
  workflow_dispatch:

jobs:
  create-ftopo:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install rasterio numpy

      - name: Create F_Topo from slope
        run: |
          python - <<'PY'
          import os
          import numpy as np
          import rasterio

          input_file = "data/topography/fars_slope.tif"
          output_file = "data/topography/fars_ftopo.tif"

          if not os.path.exists(input_file):
              raise FileNotFoundError(
                  f"Input file not found: {input_file}"
              )

          with rasterio.open(input_file) as src:

              slope = src.read(1)
              profile = src.profile.copy()
              nodata = src.nodata

              print("Input:", input_file)
              print("CRS:", src.crs)
              print("Width:", src.width)
              print("Height:", src.height)
              print("Resolution:", src.res)
              print("Input NoData:", nodata)

              # ایجاد ماسک NoData
              if nodata is not None:
                  valid = ~np.isclose(slope, nodata)
              else:
                  valid = np.isfinite(slope)

              valid &= np.isfinite(slope)

              # خروجی F_Topo
              ftopo = np.full(
                  slope.shape,
                  np.nan,
                  dtype=np.float32
              )

              # 0 تا کمتر از 5 درجه
              ftopo[(slope >= 0) & (slope < 5) & valid] = 0.00

              # 5 تا کمتر از 10 درجه
              ftopo[(slope >= 5) & (slope < 10) & valid] = 0.25

              # 10 تا کمتر از 20 درجه
              ftopo[(slope >= 10) & (slope < 20) & valid] = 0.50

              # 20 تا کمتر از 30 درجه
              ftopo[(slope >= 20) & (slope < 30) & valid] = 0.75

              # 30 درجه و بیشتر
              ftopo[(slope >= 30) & valid] = 1.00

              # NoData خروجی
              output_nodata = -9999.0
              ftopo[~valid] = output_nodata

              profile.update(
                  dtype="float32",
                  count=1,
                  nodata=output_nodata,
                  compress="deflate",
                  predictor=2
              )

              with rasterio.open(
                  output_file,
                  "w",
                  **profile
              ) as dst:
                  dst.write(ftopo, 1)

          # بررسی نتیجه
          with rasterio.open(output_file) as check:

              arr = check.read(1)
              valid_out = arr[arr != output_nodata]

              if valid_out.size == 0:
                  raise RuntimeError(
                      "F_Topo contains no valid pixels."
                  )

              unique = np.unique(valid_out)

              print("")
              print("===================================")
              print("F_Topo CREATED SUCCESSFULLY")
              print("===================================")
              print("Output:", output_file)
              print("Minimum:", float(valid_out.min()))
              print("Maximum:", float(valid_out.max()))
              print("Mean:", float(valid_out.mean()))
              print("Unique values:", unique.tolist())
              print("===================================")

              # کنترل نهایی
              allowed = {0.0, 0.25, 0.5, 0.75, 1.0}

              unexpected = [
                  float(v)
                  for v in unique
                  if float(v) not in allowed
              ]

              if unexpected:
                  raise RuntimeError(
                      f"Unexpected F_Topo values: {unexpected}"
                  )

          PY

      - name: Commit F_Topo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/topography/fars_ftopo.tif

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Create F_Topo from slope"
            git push
          fi

      - name: Upload F_Topo artifact
        uses: actions/upload-artifact@v4
        with:
          name: fars-ftopo
          path: data/topography/fars_ftopo.tif
          retention-days: 7
