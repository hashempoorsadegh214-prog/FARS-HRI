name: Update FWI and Build Raster

on:
  workflow_dispatch:

  schedule:
    - cron: "30 4 * * *"

  push:
    paths:
      - "scripts/update_fwi.py"
      - "scripts/build_fwi_raster.py"
      - "requirements.txt"
      - ".github/workflows/update-fwi.yml"

permissions:
  contents: write

concurrency:
  group: fars-hri-fwi-update
  cancel-in-progress: false

jobs:
  update-fwi:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check required project files
        run: |
          test -f scripts/update_fwi.py
          test -f scripts/build_fwi_raster.py
          test -f data/fuel/fars_fuel.tif
          test -f requirements.txt

      - name: Download FWI data and build raster
        run: |
          python scripts/update_fwi.py
          python scripts/build_fwi_raster.py

      - name: Check generated FWI files
        run: |
          test -f data/fwi/fwi_fars_grid.json
          test -f data/fwi/fwi_fars.tif

          echo "FWI JSON:"
          ls -lh data/fwi/fwi_fars_grid.json

          echo "FWI raster:"
          ls -lh data/fwi/fwi_fars.tif

      - name: Commit updated FWI data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/fwi/fwi_fars_grid.json
          git add data/fwi/fwi_fars.tif

          if git diff --cached --quiet; then
            echo "No FWI data changes to commit."
            exit 0
          fi

          git commit -m "Update gridded FWI for Fars"
          git push origin HEAD:main
