name: Update gridded FWI for Fars

on:
  workflow_dispatch:
  schedule:
    - cron: "30 4 * * *"

permissions:
  contents: write

jobs:
  update-fwi:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download and clip EFFIS FWI grid
        run: |
          python scripts/update_fwi.py

      - name: Commit updated FWI files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/fwi/fwi_fars.tif data/fwi/fwi_fars_metadata.json

          if git diff --cached --quiet; then
            echo "No FWI changes to commit."
          else
            git commit -m "Update gridded FWI for Fars"
            git push
          fi
