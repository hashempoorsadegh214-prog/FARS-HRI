name: Update FWI, Build Raster and HRI

on:
  workflow_dispatch:

  schedule:
    - cron: "30 4 * * *"

  push:
    paths:
      - "scripts/update_fwi.py"
      - "scripts/build_fwi_raster.py"
      - "scripts/build_hri.py"
      - "requirements.txt"
      - "data/fuel/fars_fuel.tif"
      - "data/fuel/Global_fuelbeds_parameters_v1.2.xlsx"
      - "data/topography/dem_fars.tif"
      - ".github/workflows/update-fwi.yml"

permissions:
  contents: write

concurrency:
  group: fars-hri-fwi-update
  cancel-in-progress: false

jobs:
  update-fwi:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sync with latest main before processing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          git rebase origin/main

      - name: Check required project files
        run: |
          test -f scripts/update_fwi.py
          test -f scripts/build_fwi_raster.py
          test -f scripts/build_hri.py
          test -f data/fuel/fars_fuel.tif
          test -f data/fuel/Global_fuelbeds_parameters_v1.2.xlsx
          test -f data/topography/dem_fars.tif
          test -f requirements.txt

          echo "All required project files are present. ✅"

      - name: Download FWI data, build FWI raster and HRI
        run: |
          python scripts/update_fwi.py
          python scripts/build_fwi_raster.py
          python scripts/build_hri.py

      - name: Check generated FWI and HRI files
        run: |
          test -f data/fwi/fwi_fars_grid.json
          test -f data/fwi/fwi_fars.tif
          test -f data/output/fars_hri.tif

          echo "========== FWI JSON =========="
          ls -lh data/fwi/fwi_fars_grid.json

          echo "========== FWI Raster =========="
          ls -lh data/fwi/fwi_fars.tif

          echo "========== Final HRI Raster =========="
          ls -lh data/output/fars_hri.tif

      - name: Commit updated FWI and HRI data
        run: |
          git add data/fwi/fwi_fars_grid.json
          git add data/fwi/fwi_fars.tif
          git add data/output/fars_hri.tif

          if git diff --cached --quiet; then
            echo "No FWI or HRI data changes to commit."
            exit 0
          fi

          git commit -m "Update FWI and HRI for Fars"

      - name: Push updated FWI and HRI data
        run: |
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "FWI and HRI data pushed successfully. ✅"
              exit 0
            fi

            echo "Push attempt ${attempt} failed."
            echo "Receiving latest main changes and trying again..."

            git pull --rebase origin main
            sleep 5
          done

          echo "Unable to push FWI and HRI data after 3 attempts."
          exit 1
