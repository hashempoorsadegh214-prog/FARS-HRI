```yaml
name: Update Fuel Data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-fuel:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install rasterio

      - name: Download and process Fuel
        run: |
          python scripts/update_fuel.py

      - name: Check output
        run: |
          echo "Checking Fuel output..."

          if [ ! -f "data/fuel/fars_fuel.tif" ]; then
            echo "ERROR: fars_fuel.tif was not created."
            exit 1
          fi

          echo "Fuel TIFF:"
          ls -lh data/fuel/fars_fuel.tif

          echo "Fuel directory:"
          ls -lah data/fuel/

      - name: Save Fuel data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/fuel/

          if git diff --cached --quiet; then
            echo "No Fuel changes to commit."
          else
            git commit -m "Update Fars Fuel data"
            git push
          fi
```
