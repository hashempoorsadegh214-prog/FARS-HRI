```yaml
name: Update Fuel Data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-fuel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install rasterio

      - name: Download and process Fuel data
        run: python scripts/update_fuel.py

      - name: Save Fuel data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fuel/
          git diff --cached --quiet || git commit -m "Update Fars Fuel data"
          git push
```
